<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SAiMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page-shell auth-shell">
    <nav class="top-nav">
      <a class="nav-brand" href="index.html">
        <img src="asset/logo.png" alt="SAiMS logo">
        <span>SAIMS</span>
      </a>
      <div class="nav-links"></div>
    </nav>

    <main class="auth-main">
      <section class="panel auth-panel">
        <img class="auth-logo" src="asset/logo.png" alt="SAiMS logo">
        <p class="eyebrow">Secure Access</p>
        <h1 class="auth-title">Admin Login</h1>
        <p class="hero-copy">Sign in to add, edit, or delete personnel and inventory records.</p>
        <form id="loginForm" class="stack-form auth-form">
          <label>
            <span>Username</span>
            <input type="text" id="loginUsername" autocomplete="username" required>
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="loginPassword" autocomplete="current-password" required>
          </label>
          <p id="loginError" class="auth-feedback hidden"></p>
          <button type="submit" class="primary-btn">Login</button>
        </form>
        <a class="landing-return-btn" href="index.html"><span aria-hidden="true">←</span> Back to Landing Page</a>
      </section>
    </main>
  </div>

  <script src="main.js"></script>
</body>

</html>
