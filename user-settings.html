<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Settings | SAiMS</title><link rel="stylesheet" href="styles.css"></head><body><div class="page-shell"><nav class="top-nav"><a class="nav-brand" href="dashboard.html"><img src="asset/logo.png" alt="SAiMS logo"><span>SAiMS</span></a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="teachers.html">Personnel</a><a href="inventory-item.html">Inventory Item</a><a href="inventory-list.html">Inventory Listing</a><a href="stock-card.html">Stock Card</a><a href="reports.html">Reports</a></div></nav><header class="page-header"><p class="eyebrow">Administration</p><h1 class="page-title" id="userSettingsTitle">User Settings</h1><p class="hero-copy" id="userSettingsIntro">Update account details, role, and management coverage.</p></header><main><section class="panel user-settings-card"><form id="userSettingsForm" class="stack-form"><div id="userSettingsMessage" class="form-message hidden" role="status"></div><div class="form-section"><h2>Account details</h2><div class="form-grid"><label>Username<input id="userUsername" required autocomplete="off"></label><label id="userPasswordWrap">Temporary password<input id="userPassword" type="password" minlength="8" autocomplete="new-password"><small>At least 8 characters.</small></label><label>Last name<input id="userLastName" required></label><label>First name<input id="userFirstName" required></label><label>Middle name<input id="userMiddleName"></label></div></div><div class="form-section"><h2>Access and coverage</h2><div class="form-grid"><label>User role<select id="userRole" required><option value="admin">Admin</option><option value="manager">Manager</option><option value="staff">Staff</option></select></label><label>Status<select id="userStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></label><label class="field-wide" id="userAssignmentWrap">Assigned office or school<select id="userAssignment"></select><small>Choose the area this user can manage.</small></label></div><div class="role-summary" id="roleSummary"></div></div><div class="form-actions"><a class="ghost-btn button-link" href="settings.html">Cancel</a><button class="primary-btn" id="userSubmitButton" type="submit">Save changes</button></div></form></section></main></div><script src="main.js"></script></body></html>
